
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | MyPAWS Redo</title>
   <link rel="icon" type="image/png" href="/assets/mypaws-paw-icon.png">

    <link rel="stylesheet" href="StudentShell.css">
    <link rel="stylesheet" href="AccountShell.css">
    <script src="AccountShell.js" defer></script>

    <script src="ForgotPassword.js" defer></script>
</head>
<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>
<header class="account-header"><a class="account-brand" href="Main.html"><img src="/assets/mypaws-paw-icon.png" alt="" width="52" height="52">myPAWS <small>REDO</small></a><a href="Main.html">Back to login</a></header>

    <main class="auth-main" id="main-content" tabindex="-1">
        <div class="auth-card">
            <p class="eyebrow">Account recovery</p>
            <h1>Forgot Password?</h1>

            <p>
                Enter your account email to receive
                a password-reset link.
            </p>

            <form id="forgotPasswordForm">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >

                <button type="submit" id="submitButton">
                    Send Reset Link
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <a href="/LoginUI/Main.html">
                Back to Login
            </a>
        </div>
    </main>

<footer class="auth-footer">MyPAWS Redo · Unofficial CSUSB student project</footer>
</body>
</html>
