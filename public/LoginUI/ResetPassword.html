
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password | MyPAWS Redo</title>
<link rel="icon" type="image/png" href="/assets/mypaws-paw-icon.png">

    <link rel="stylesheet" href="StudentShell.css">
    <link rel="stylesheet" href="AccountShell.css">
    <script src="AccountShell.js" defer></script>

    <script src="ResetPassword.js" defer></script>
</head>
<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>
<header class="account-header"><a class="account-brand" href="Main.html"><img src="/assets/mypaws-paw-icon.png" alt="" width="52" height="52">myPAWS <small>REDO</small></a><a href="Main.html">Back to login</a></header>

    <main class="auth-main" id="main-content" tabindex="-1">
        <div class="auth-card">
            <p class="eyebrow">Account recovery</p>
            <h1>Reset Password</h1>

            <p id="resetInstructions">
                Enter your new password below.
                Use at least 8 characters, including
                one letter and one number.
            </p>

            <form id="resetPasswordForm">
                <label for="password">New Password</label>
                <input
                    type="password"
                    id="password"
                    aria-describedby="resetInstructions"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">
                    Confirm New Password
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" id="submitButton">
                    Reset Password
                </button>
            </form>

            <p><a href="ForgotPassword.html">Request a new reset link</a></p>
            <p id="message" role="status" aria-live="polite"></p>

            <a href="/LoginUI/Main.html">
                Back to Login
            </a>
        </div>
    </main>

<footer class="auth-footer">MyPAWS Redo · Unofficial CSUSB student project</footer>
</body>
</html>
