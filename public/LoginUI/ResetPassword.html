
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password | MyPAWS Redo</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #F5F7FB;
            color: #192B40;
        }

        header {
            background: #193D68;
            color: white;
            padding: 22px 6%;
            font-size: 20px;
            font-weight: bold;
        }

        main {
            max-width: 460px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 32px;
        }

        h1 { font-size: 26px; }

        p {
            color: #64748B;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #CBD5E1;
            border-radius: 7px;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #193D68;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message { margin-top: 16px; }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #195AA5;
        }
    </style>

    <script src="ResetPassword.js" defer></script>
</head>
<body>

    <header>myPAWS REDO</header>

    <main>
        <div class="card">
            <h1>Reset Password</h1>

            <p id="resetInstructions">
                Enter your new password below.
                Use at least 8 characters, including
                one letter and one number.
            </p>

            <form id="resetPasswordForm">
                <label for="password">New Password</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">
                    Confirm New Password
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" id="submitButton">
                    Reset Password
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <a href="/LoginUI/Main.html">
                Back to Login
            </a>
        </div>
    </main>

</body>
</html>
