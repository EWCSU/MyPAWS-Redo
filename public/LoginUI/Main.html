
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPAWS Redo | Login</title>
    <link rel="stylesheet" href="Main.css">
    <script src="Login.js" defer></script>
</head>
<body>
    <main class="box">
        <img
            src="MyPAWsREDO.jpg"
            alt="MyPAWS Redo Logo"
            style="width:180px;max-width:50%;height:auto;"
        >

        <h1>Student Login</h1>
        <p>Access your academic progress and degree audit.</p>

        <form id="loginForm" class="Input-form">
            <label class="label" for="email">Email</label>
            <input
                id="email"
                class="Textbox1"
                type="email"
                autocomplete="username"
                placeholder="Enter your test account email"
                required
            >

            <label class="label" for="password">Password</label>
            <input
                id="password"
                class="Textbox2"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
            >
		
	<p class="forgot-password-link">
   	 <a href="/LoginUI/ForgotPassword.html">
        	Forgot Password?
    	 </a>
       </p>

            <button class="Login" type="submit">
                Login
            </button>
        </form>

        <form id="codeForm" class="Input-form"
              style="display:none;">
            <h2>Email Verification</h2>
            <p>Enter the six-digit code sent to your email.</p>

            <label class="label" for="code">
                Verification Code
            </label>
            <input
                id="code"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                maxlength="6"
                placeholder="000000"
                required
            >

            <button class="Login" type="submit">
                Verify Code
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
