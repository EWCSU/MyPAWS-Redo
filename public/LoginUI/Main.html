<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PAWS REDO MAIN</title>
    <link rel="icon"type="image/png"  href="CSUSB-logo-2.png">
    <link rel="stylesheet" href="Main.css">
</head>
<body>
    <div class="box">
      <h1><img src="MyPAWsREDO.jpg"></h1>
        <form class="Input-form" id="loginForm">
    <label>Student ID</label>
<input class="Textbox1" id="username" type="text" autocomplete="username" placeholder="Student ID" required>
    <label>Password </label>
    <input class="Textbox2" id="password" type="password" placeholder="Password" required>
    <button class="Login" type="submit">Login</button>
    <a href="https://www.csusb.edu/"><button class="Cancel" type="button">Cancel</button></a>
</form>

<form class="Input-form" id="codeForm" style="display:none;">
    <label>Verification code</label>
    <input class="Textbox1" id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
    <button class="Login" type="submit">Verify</button>
</form>

<p id="message"></p>
    </div>
    <script src="Login.js" defer></script>
</body>
</html>
